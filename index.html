<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Cruce Urbantz - Tarifas</title>
    <link rel="stylesheet" href="CCT.css">
    <script src="xlsx.full.min.js"></script>
    <script src="articulos.js"></script>
    <style>
        /* Modal de asignación de familias (CCT) */
        .cct-modal-overlay{position:fixed;inset:0;background:rgba(20,24,31,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
        .cct-modal{background:#fff;color:#1d2330;width:min(820px,100%);max-height:90vh;display:flex;flex-direction:column;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);font-family:inherit}
        .cct-modal-head{padding:18px 22px 10px}
        .cct-modal-head h2{margin:0 0 6px;font-size:1.15rem}
        .cct-modal-head p{margin:0;font-size:.92rem;color:#4a5365;line-height:1.4}
        .cct-modal-body{padding:0 22px;overflow:auto;flex:1}
        .cct-modal-table{width:100%;border-collapse:collapse;font-size:.9rem}
        .cct-modal-table th{position:sticky;top:0;background:#fff;text-align:left;padding:8px 8px;border-bottom:2px solid #d5dae3;font-weight:600}
        .cct-modal-table td{padding:7px 8px;border-bottom:1px solid #e8ebf0;vertical-align:middle}
        .cct-modal-table .cct-code{font-variant-numeric:tabular-nums;white-space:nowrap}
        .cct-modal-table select{width:100%;min-width:200px;padding:6px 8px;font:inherit;border:1px solid #b9c1cf;border-radius:4px;background:#fff}
        .cct-modal-table select.cct-invalid{border-color:#c0392b;background:#fdecea}
        .cct-modal-foot{display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid #e8ebf0}
        .cct-modal-msg{flex:1;color:#c0392b;font-size:.88rem}
        .cct-modal-foot button{font:inherit;padding:8px 16px;border-radius:4px;cursor:pointer;border:1px solid transparent}
        .cct-btn-primary{background:#1f5fbf;color:#fff}
        .cct-btn-primary:hover{background:#184c99}
        .cct-btn-secondary{background:#fff;color:#1d2330;border-color:#b9c1cf!important}
        .cct-btn-secondary:hover{background:#f2f4f8}
        .cct-modal-foot button:focus-visible,.cct-modal-table select:focus-visible{outline:2px solid #1f5fbf;outline-offset:2px}
    </style>
</head>
<body>
    <main class="container">
        <h1>Cruce datos Urbantz - BKO</h1>

        <section class="controls">
            <div class="files-box">
                <label class="file-label">
                    El primer paso es ir a Urbantz, tareas, y, arriba a la izquierda entrar en la vista de "Artículos".<br>
                    Añade todas las columnas necesarias y filtra el día de transporte del que quieras sacar los datos.<br>
                    Exporta el archivo xlsx. Ábrelo con Excel/LibreOffice, copia todos los pedidos de venta y ve a back office.<br>
                    En back office ve a "lineas de pedidos de ventas abiertas" y pega los pedidos en la columna "Pedidos de venta"
                    usando la opción "es uno de". Como estará todo facturado, no saldrán apenas líneas. <br>
                    Ahora haz click en el icono de filtro a la derecha y borra el filtro de "Estado de línea" para que aparezcan las líneas facturadas. Exporta las filas.<br>
                    Por último en BKO, "Diario de facturas (de clientes), filtra los pedidos de ventas y exporta las filas, importante que estén las columnas "Pedido de ventas", "Factura" y "Gastos totales".
                    Sube los ficheros xlsx que has sacado de Urbantz y de Back office aquí.
                </label>
                <label class="file-label">
                    Urbantz - fichero .xlsx (Tareas -> Artículos) (Expedidor, Retirada, Transportista, etc)
                    <input type="file" id="fileInput" accept=".xlsx">
                </label>
                <label class="file-label">
                    BKO - fichero .xlsx (líneas pedidos de ventas abiertas) (Borrar filtro de "Estado de línea" -"Pedido abierto")
                    <input type="file" id="fileInput2" accept=".xlsx">
                </label>
                <label class="file-label">
                    BKO - Tercer fichero (Diario de facturas - para sacar gastos facturados)
                    <input type="file" id="fileInput3" accept=".xlsx">
                </label>

            </div>

            <div class="tarifas-box">
                <h2>Tarifas (modificables)</h2>
                <div id="tarifas">
                    <label>Sillón: <input type="number" id="t_sillon" value="20" step="0.01"></label>
                    <label>Sofá: <input type="number" id="t_sofa" value="27" step="0.01"></label>
                    <label>Chaise / Rinconera: <input type="number" id="t_chais" value="35" step="0.01"></label>
                    <label>Canapé: <input type="number" id="t_canape" value="30" step="0.01"></label>
                    <label>Descanso: <input type="number" id="t_descanso" value="12" step="0.01"></label>
                    <label>Electro: <input type="number" id="t_electro" value="19" step="0.01"></label>
                    <label>Americano: <input type="number" id="t_americano" value="22" step="0.01"></label>
                    <label>Premium: <input type="number" id="t_premium" value="0.105" step="0.001"></label>
                    <label>Óptima: <input type="number" id="t_optima" value="0.05" step="0.001"></label>
                </div>
            </div>

            <div class="search-filter">
                <input id="searchInput" type="search" placeholder="Buscar por Identificador, Producto o Código">
                <select id="categoryFilter">
                    <option value="all">Filtrar: Todas las categorías</option>
                    <option value="chais">Chaise / Rinconera</option>
                    <option value="sofa">Sofá</option>
                    <option value="sillon">Sillón</option>
                    <option value="descanso">Descanso</option>
                    <option value="canape">Canapé</option>
                    <option value="electro">Electro</option>
                    <option value="americano">Americano</option>
                    <option value="none">Sin categoría</option>
                </select>
                <button id="exportBtn" disabled>Descargar Excel Resultante</button>
            </div>
        </section>

        <section class="table-section">
            <div class="table-wrap">
                <table id="resultTable">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
            <p id="countInfo" class="count-info"></p>
        </section>
    </main>

    <script>
/* ============ CCT.js ============ */

/* --- Tarifas iniciales (se leen del DOM) --- */
let t_sillon = Number(document.getElementById('t_sillon').value) || 20;
let t_sofa = Number(document.getElementById('t_sofa').value) || 27;
let t_chais = Number(document.getElementById('t_chais').value) || 35;
let t_canape = Number(document.getElementById('t_canape').value) || 30;
let t_descanso = Number(document.getElementById('t_descanso').value) || 12;
let t_electro = Number(document.getElementById('t_electro').value) || 19;
let t_americano = Number(document.getElementById('t_americano').value) || 22;
let t_premium = Number(document.getElementById('t_premium').value) || 0.105;
let t_optima = Number(document.getElementById('t_optima').value) || 0.05;

/* --- Elementos DOM --- */
const fileInput = document.getElementById('fileInput');
const fileInput2 = document.getElementById('fileInput2');
const fileInput3 = document.getElementById('fileInput3');
const exportBtn = document.getElementById('exportBtn');
const tableHead = document.querySelector('#resultTable thead');
const tableBody = document.querySelector('#resultTable tbody');
const searchInput = document.getElementById('searchInput');
const categoryFilter = document.getElementById('categoryFilter');
const countInfo = document.getElementById('countInfo');

/* --- Datos en memoria --- */
let originalRows = [];   // rows raw del primer excel (para re-procesar)
let processedData = [];  // filas procesadas mostradas / exportadas
let secondData = [];     // JSON del segundo excel (Importe neto)
let thirdData = [];      // JSON del tercer excel (Gastos totales, Factura)

/* --- Familias asignadas manualmente para códigos que NO están en articulos.js --- */
const MANUAL_STORAGE_KEY = 'cct_familias_manuales_v1';
let manualFamilies = loadManualFamilies();   // { claveCodigo: "sofa" | "electro" | ... | "vacio" | "modo" }

/* Opciones del desplegable. "key" es la categoría interna que usa el cálculo de tarifas */
const FAMILY_OPTIONS = [
    { key: 'sofa',      label: 'Sofá' },
    { key: 'sillon',    label: 'Sillón' },
    { key: 'chais',     label: 'Chaise / Rinconera' },
    { key: 'canape',    label: 'Canapé' },
    { key: 'descanso',  label: 'Descanso' },
    { key: 'electro',   label: 'Electro' },
    { key: 'americano', label: 'Americano' },
    { key: 'vacio',     label: 'Sin cargo (patas, servicio, etc.)' },
    { key: 'modo',      label: 'Usar modo de entrega (Premium / Óptima)' }
];

function loadManualFamilies(){
    try { return JSON.parse(localStorage.getItem(MANUAL_STORAGE_KEY)) || {}; }
    catch(e){ return {}; }
}
function saveManualFamilies(){
    try { localStorage.setItem(MANUAL_STORAGE_KEY, JSON.stringify(manualFamilies)); }
    catch(e){ /* almacenamiento no disponible: se mantiene solo en memoria */ }
}

/* ===== utilidades ===== */
function normalizeText(txt){ return String(txt ?? "").replace(/\s+/g,' ').trim().toUpperCase(); }
function ceil2(n){ return Math.ceil(Number(n) * 100) / 100; } // redondeo AL ALZA a 2 decimales

/* categorias (detección por prefijos) */
const CAT = {
    chais:["RINCONERA","CHAISE LONGUE"],
    sofa:["SOFA","SOFA CAMA"],
    sillon:["SILLON","COMPLEMENTO SOFAS"],
    descanso:["COLCHONES","SOMIERS","BASES"],
    canape:["CANAPE","CANAPÉ"],
    electro:["EVACUAC","BOMBA DE CALOR","COMBI","FRONTAL 200","2 PUERTAS 211","CONDENSACION 194","HORIZONTAL","CALEFACCIÓN","INTEGRABLE","SECADORA","LED","OLED","UHD","LAVADORA","FRIGORÍFICO","HORNOS","PLACA","CAMPANA","VINOTECAS", "LIBRE INSTALACIÓN"],
    americano:["AMERICANOS","SIDE BY SIDE"]
};
function detectCategory(txt){
    const n = normalizeText(txt);
    for(const [k,list] of Object.entries(CAT)) if(list.some(p => n.startsWith(normalizeText(p)))) return k;
    return "none";
}
function tarifaPorCategoria(cat){
    return {
        chais:t_chais, sofa:t_sofa, sillon:t_sillon,
        descanso:t_descanso, canape:t_canape, electro:t_electro, americano:t_americano
    }[cat] ?? "";
}

/* --- Actualizar tarifas desde inputs y re-procesar si ya hay datos --- */
document.getElementById('tarifas').addEventListener('input', () => {
    t_sillon = Number(document.getElementById('t_sillon').value) || 0;
    t_sofa = Number(document.getElementById('t_sofa').value) || 0;
    t_chais = Number(document.getElementById('t_chais').value) || 0;
    t_canape = Number(document.getElementById('t_canape').value) || 0;
    t_descanso = Number(document.getElementById('t_descanso').value) || 0;
    t_electro = Number(document.getElementById('t_electro').value) || 0;
    t_americano = Number(document.getElementById('t_americano').value) || 0;
    t_premium = Number(document.getElementById('t_premium').value) || 0;
    t_optima = Number(document.getElementById('t_optima').value) || 0;

    if(originalRows.length) {
        processedData = originalRows.map(processRow);
        applyBusinessRules();
        applyPedidoSummaries();
        renderTable();
    }
});

/* ===========================
    CARGA DEL SEGUNDO EXCEL
   =========================== */
fileInput2.addEventListener('change',e=>{
    const file = e.target.files[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = e =>{
        const wb = XLSX.read(e.target.result,{type:'binary'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        secondData = XLSX.utils.sheet_to_json(sheet,{defval:""});
    };
    r.readAsBinaryString(file);
});

/* ===========================
    CARGA DEL TERCER EXCEL (Gastos / Facturas)
   =========================== */
fileInput3.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = e=>{
        const wb = XLSX.read(e.target.result,{type:'binary'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        thirdData = XLSX.utils.sheet_to_json(sheet,{defval:""});
    };
    r.readAsBinaryString(file);
});

/* ===========================
    CARGA DEL PRIMER EXCEL (solo si hay secondData y thirdData)
   =========================== */
fileInput.addEventListener('change', ()=>{
    if(!secondData.length){
        alert("⚠️ Debes cargar primero el segundo archivo (Importe neto).");
        fileInput.value = "";
        return;
    }
    if(!thirdData.length){
        alert("⚠️ Debes cargar también el tercer archivo (Gastos/Facturas).");
        fileInput.value = "";
        return;
    }
    const file = fileInput.files[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = async e=>{
        const wb = XLSX.read(e.target.result,{type:'binary'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet,{defval:""});
        originalRows = rows.slice(); // guardamos los raws

        // Códigos que no están en articulos.js: pedir la familia al usuario
        const missing = findMissingCodes(originalRows);
        if(missing.length) await askForFamilies(missing);

        processedData = originalRows.map(processRow);
        applyBusinessRules();
        applyPedidoSummaries();
        renderTable();
        exportBtn.disabled = false;
    };
    r.readAsBinaryString(file);
});

/* ===========================
    HELPERS DE CAMPOS Y CRUCE CON articulos.js
   =========================== */
function getCodigo(row){
    return row["Artículo – Referencia"] ?? row["Artículo - Referencia"] ?? row["Referencia"] ?? "";
}
function getProducto(row){
    return row["Artículo – Nombre"] ?? row["Artículo - Nombre"] ?? row["Artículo Nombre"] ?? row["Artículo"] ?? "";
}
/* Devuelve la familia de articulos.js o null si el código no existe */
function lookupArticulo(codigo){
    if(typeof articulos === 'undefined') return null;
    const refKey = String(codigo ?? "").trim();
    if(refKey === "") return null;
    const v = articulos[refKey] ?? articulos[Number(refKey)];
    return (v === undefined || v === null || String(v).trim() === "") ? null : v;
}
function isVacioProducto(producto){
    const n = normalizeText(producto);
    return n.includes("PATAS") || n.includes("SERVICIO");
}
/* Clave para recordar la familia elegida: el código; si no hay código, el nombre del producto */
function familyKey(codigo, producto){
    const c = String(codigo ?? "").trim();
    return c !== "" ? c : "SIN-CODIGO::" + normalizeText(producto);
}
function familyLabel(key){
    return (FAMILY_OPTIONS.find(o => o.key === key) || {}).label || key;
}

/* Códigos que no están en articulos.js (agrupados por código), salvo patas/servicio que ya van a "vacío" */
function findMissingCodes(rows){
    const map = new Map();
    rows.forEach(row=>{
        const codigo = getCodigo(row);
        const producto = getProducto(row);
        if(lookupArticulo(codigo) !== null) return;
        if(isVacioProducto(producto)) return;
        const key = familyKey(codigo, producto);
        if(!map.has(key)) map.set(key, { key, codigo: String(codigo).trim(), productos: new Set(), modos: new Set() });
        const item = map.get(key);
        if(String(producto).trim() !== "") item.productos.add(String(producto).trim());
        const modo = normalizeText(row["Modo de Entrega"] ?? row["Modo de entrega"] ?? "");
        if(modo) item.modos.add(modo);
    });
    return [...map.values()];
}

/* ===========================
    MODAL: asignar familia a códigos desconocidos
   =========================== */
function askForFamilies(missing){
    return new Promise(resolve=>{
        const overlay = document.createElement('div');
        overlay.className = 'cct-modal-overlay';
        overlay.innerHTML = `
            <div class="cct-modal" role="dialog" aria-modal="true" aria-labelledby="cctModalTitle">
                <header class="cct-modal-head">
                    <h2 id="cctModalTitle">Códigos sin familia</h2>
                    <p>Estos ${missing.length} código(s) no están en articulos.js.
                       Elige la familia de cada uno para calcular los gastos.</p>
                </header>
                <div class="cct-modal-body">
                    <table class="cct-modal-table">
                        <thead><tr><th>Código</th><th>Producto</th><th>Familia</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <footer class="cct-modal-foot">
                    <span class="cct-modal-msg" role="alert"></span>
                    <button type="button" class="cct-btn-secondary" data-act="skip">Calcular sin asignar</button>
                    <button type="button" class="cct-btn-primary" data-act="ok">Aplicar y calcular</button>
                </footer>
            </div>`;
        const tbody = overlay.querySelector('tbody');
        const msg = overlay.querySelector('.cct-modal-msg');

        missing.forEach((m, i)=>{
            const saved = manualFamilies[m.key] || "";
            const modoAuto = [...m.modos].some(x => /PREM|TIMA|OPTIMA|ÓPTIMA/.test(x));
            const preselected = saved || (modoAuto ? 'modo' : '');
            const options = ['<option value="">— Selecciona —</option>']
                .concat(FAMILY_OPTIONS.map(o =>
                    `<option value="${o.key}"${o.key === preselected ? ' selected' : ''}>${escapeHtml(o.label)}</option>`))
                .join('');
            const producto = [...m.productos].join(' / ') || '(sin nombre)';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="cct-code">${escapeHtml(m.codigo || '(sin código)')}</td>
                <td>${escapeHtml(producto)}</td>
                <td><select data-idx="${i}" aria-label="Familia de ${escapeHtml(m.codigo || producto)}">${options}</select></td>`;
            tbody.appendChild(tr);
        });

        function close(result){
            document.removeEventListener('keydown', onKey);
            overlay.remove();
            resolve(result);
        }
        function onKey(e){ if(e.key === 'Escape') close(false); }
        document.addEventListener('keydown', onKey);

        overlay.addEventListener('change', e=>{
            if(e.target.tagName === 'SELECT'){
                e.target.classList.remove('cct-invalid');
                msg.textContent = '';
            }
        });
        overlay.addEventListener('click', e=>{
            const act = e.target.dataset && e.target.dataset.act;
            if(act === 'skip') return close(false);
            if(act !== 'ok') return;

            const selects = [...overlay.querySelectorAll('select')];
            let pending = 0;
            selects.forEach(s=>{
                if(!s.value){ s.classList.add('cct-invalid'); pending++; }
            });
            if(pending){
                msg.textContent = `Faltan ${pending} código(s) por asignar.`;
                const firstBad = selects.find(s => !s.value);
                if(firstBad) firstBad.focus();
                return;
            }
            selects.forEach(s=>{ manualFamilies[missing[Number(s.dataset.idx)].key] = s.value; });
            saveManualFamilies();
            close(true);
        });

        document.body.appendChild(overlay);
        const firstEmpty = overlay.querySelector('select');
        if(firstEmpty) firstEmpty.focus();
    });
}

/* ===========================
    PROCESS ONE ROW -> objeto final
   =========================== */
function processRow(row){
    // múltiples nombres posibles en Excel original
    const fecha = row["Fecha "] ?? row["Fecha"] ?? "";
    const expedidor = row["Expedidor"] ?? "";
    const transportista = row["Transportista"] ?? "";

    const identificador = row["Identificador de la tarea"] ?? row["Identificador"] ?? "";
    const pedido = (typeof identificador === "string" && identificador.includes("|")) ? identificador.split("|")[0].trim() : identificador;

    const nombre = row["Representante del cliente"] ?? "";
    const town = row["Ciudad"] ?? "";
    const postalcode = row["Código postal"] ?? "";

    const repartidor = row["Repartidor"] ?? "";
    const ruta = row["Ruta"] ?? "";

    const producto = getProducto(row);

    let cantidad = row["Artículo – Cantidad"] ?? row["Artículo - Cantidad"] ?? row["Artículo Cantidad"] ?? row["Cantidad"];
    cantidad = Number(cantidad || 1);

    const codigo = getCodigo(row);

    const retirada = row["Retirada"] ?? "";
    const estado = row["Estado"] ?? "";

    // Cruce con articulos.js (null si el código no existe)
    const cruceArticulo = lookupArticulo(codigo);
    const modoEntrega = row["Modo de Entrega"] ?? row["Modo de entrega"] ?? "";

    let familia = cruceArticulo ?? "";
    let categoria;
    if(cruceArticulo !== null){
        // categoría detectada o modo de entrega
        categoria = detectCategory(cruceArticulo);
        if(categoria === "none" || categoria === "") categoria = modoEntrega;
    } else {
        // Código ausente en articulos.js: se usa la familia elegida por el usuario (si la hay)
        const manual = manualFamilies[familyKey(codigo, producto)];
        if(manual && manual !== "modo"){
            categoria = (manual === "vacio") ? "vacío" : manual;
            familia = "(manual) " + familyLabel(manual);
        } else {
            categoria = modoEntrega;
        }
    }
    // Productos tipo "patas" o "servicio" = categoría "vacío"
    if(isVacioProducto(producto)) categoria = "vacío";


    // Cruce con segundo excel (Importe neto)
    const match = secondData.find(r =>
        normalizeText(r["Pedido de ventas"]) === normalizeText(pedido) &&
        normalizeText(r["Código de artículo"]) === normalizeText(codigo)
    );
    const importeNetoRaw = match ? (Number(match["Importe neto"]) || 0) : "";

    // Neto / ud (antes de Importe neto)
    const netoPorUdRaw = (importeNetoRaw === "" || cantidad === 0) ? "" : (importeNetoRaw / cantidad);

    // Tarifa unit. => lógica especial si PREM / TIMA y hay importeNeto, sino por categoría
    let tarifaUnitRaw = "";
    if(categoria === "vacío") {
        tarifaUnitRaw = 0;
    } else if(String(categoria).toUpperCase().includes("ENTREGA PREMIUM") && importeNetoRaw !== "") {
        tarifaUnitRaw = (importeNetoRaw / cantidad) * t_premium;
    } else if(String(categoria).toUpperCase().includes("WEB - ENT PREMIUM") && importeNetoRaw !== "") {
        tarifaUnitRaw = (importeNetoRaw / cantidad) * t_premium;
    } else if(String(categoria).toUpperCase().includes("ENTREGA ÓPTIMA") && importeNetoRaw !== "") {
        tarifaUnitRaw = (importeNetoRaw / cantidad) * t_optima;
    } else if(String(categoria).toUpperCase().includes("WEB - ENT OPTIMA") && importeNetoRaw !== "") {
        tarifaUnitRaw = (importeNetoRaw / cantidad) * t_optima;
    } else {
        tarifaUnitRaw = tarifaPorCategoria(categoria);
    }


    // Tarifa x ud (cantidad * tarifa unit.) y total (tarifaUnit * cantidad)
    const tarifaXudRaw = (tarifaUnitRaw === "" || tarifaUnitRaw === null) ? "" : (Number(cantidad) * Number(tarifaUnitRaw));
    const totalRaw = (tarifaUnitRaw === "" || tarifaUnitRaw === null) ? "" : (Number(tarifaUnitRaw) * Number(cantidad));

    // Aplicar redondeo AL ALZA a centésimas para las columnas solicitadas
    const importeNeto = importeNetoRaw === "" ? "" : ceil2(importeNetoRaw);
    const netoPorUd = (netoPorUdRaw === "" ? "" : ceil2(netoPorUdRaw));
    const tarifaUnit = (tarifaUnitRaw === "" ? "" : ceil2(tarifaUnitRaw));
    const tarifaXud = (tarifaXudRaw === "" ? "" : ceil2(tarifaXudRaw));
    const total = (totalRaw === "" ? "" : ceil2(totalRaw));

    // Comentarios
    const comentarioOK = row["Comentario de la entrega "] ?? ""; // fix
    const comentarioKO = row["comentario_entrega_fallida"] ?? "";

    return {
        "Fecha": fecha,
        "Expedidor": expedidor,
        "Transportista": transportista,
        "Ruta": ruta,
        "Repartidor": repartidor,
        "Identificador de la tarea": identificador,
        "Cuenta": row["Cuenta del cliente"] ?? row["Cuenta"] ?? "",
        "Pedido de ventas": pedido,
        "Nombre": nombre,
        "Ciudad": town,
        "CP": postalcode,
        "Producto": producto,
        "Categoría": categoria,
        "Cantidad": cantidad,
        "Neto / ud": netoPorUd,
        "Importe neto": importeNeto,
        "Código": codigo,
        "Familia": familia,
        "Tarifa unit.": tarifaUnit,
        "Tarifa x ud": tarifaXud,
        "Total": total,
        "Retirada": retirada,
        "Estado": estado,
        // columnas nuevas (se rellenarán por pedido en applyPedidoSummaries)
        "Total coste pedido": "",
        "Gastos facturados SIN IVA": "",
        "Diferencia": "",
        "Comentario OK": comentarioOK,
        "Comentario KO": comentarioKO
    };
}

/* ===========================
    REGLAS POR PEDIDO (ya usan los campos procesados)
   =========================== */
function applyBusinessRules(){
    const groups = {};
    processedData.forEach(r => {
        const p = r["Pedido de ventas"] ?? "";
        if(!groups[p]) groups[p] = [];
        groups[p].push(r);
    });

    for(const p in groups){
        const rows = groups[p];
        const hasPREM = rows.some(r => String(r["Categoría"]).includes("PREM"));
        const hasTIMA = rows.some(r => String(r["Categoría"]).includes("TIMA"));

        if(hasPREM && hasTIMA){
            rows.forEach(r=>{
                if(String(r["Categoría"]).includes("TIMA")){
                    r["Categoría"] = "autocorregido PREM";
                }
            });
        }

        if(hasPREM && !hasTIMA){
            let sum = rows.filter(r=>String(r["Categoría"]).includes("PREM"))
                          .reduce((a,r)=>a+(Number(r["Total"])||0),0);
            sum = Math.max(sum,55);
            let first=true;
            rows.forEach(r=>{
                if(String(r["Categoría"]).includes("PREM")){
                    r["Total"] = first ? ceil2(sum) : "";
                    first=false;
                }
            });
        }

        if(hasTIMA && !hasPREM){
            let sum = rows.filter(r=>String(r["Categoría"]).includes("TIMA"))
                          .reduce((a,r)=>a+(Number(r["Total"])||0),0);
            sum = Math.max(sum,20);
            let first=true;
            rows.forEach(r=>{
                if(String(r["Categoría"]).includes("TIMA")){
                    r["Total"] = first ? ceil2(sum) : "";
                    first=false;
                }
            });
        }
    }
}

/* ===========================
    RESÚMENES POR PEDIDO (Total coste pedido y Gastos facturados SIN IVA)
   =========================== */
function applyPedidoSummaries(){
    // Pre-calcular gastos por pedido desde thirdData
    const gastosByPedido = {};
    thirdData.forEach(r=>{
        const p = String(r["Pedido de ventas"] ?? "").trim();
        if(!p) return;
        const gasto = Number(r["Gastos totales"] || r["Gasto total"] || 0) || 0;
        gastosByPedido[p] = (gastosByPedido[p] || 0) + gasto;
    });

    // Agrupamos
    const groups = {};
    processedData.forEach(r=>{
        const p = r["Pedido de ventas"] ?? "";
        if(!groups[p]) groups[p] = [];
        groups[p].push(r);
        r["Total coste pedido"] = "";
        r["Gastos facturados SIN IVA"] = "";
        r["Diferencia"] = "";
    });

    for(const p in groups){
        const rows = groups[p];

        /* -----------------------------
           (1) AJUSTE ELECTRO + Tarifa
        ------------------------------*/
        const electroRows = rows.filter(r => String(r["Categoría"]).toLowerCase().includes("electro"));
        if(electroRows.length > 2){
            // Dejar primeras 2 tal cual, y a partir de la 3ª aplicar tarifa 12€
            for(let i = 2; i < electroRows.length; i++){
                const r = electroRows[i];
                const cantidad = Number(r["Cantidad"]) || 1;
                const nuevoTotal = ceil2(cantidad * 12);
                r["Tarifa unit."] = ceil2(12);
                r["Tarifa x ud"] = ceil2(cantidad * 12);
                r["Total"] = nuevoTotal;
            }
        }

        /* -----------------------------
           (2) SUMATORIO BASE
        ------------------------------*/
        let sumaTotal = rows.reduce((a,r)=> a + (Number(r["Total"])||0), 0);

        /* -----------------------------
           (3) SUMAS POR RETIRADA
        ------------------------------*/
        for(const r of rows){
            const ret = normalizeText(r["Retirada"]);
            if(ret.includes("RETIRADA CHAIS") || ret.includes("RINCONERA")) sumaTotal += 15;
            else if(ret.includes("RETIRADA SOFAS")) sumaTotal += 15;
            else if(ret.includes("RETIRADA DE SILLON")) sumaTotal += 15;
            else if(ret.includes("RETIRADA DESCANSO")) sumaTotal += 12;
        }

        sumaTotal = ceil2(sumaTotal);

        /* -----------------------------
           (4) GASTOS FACTURADOS
        ------------------------------*/
        const gastosRaw = gastosByPedido[p] || 0;
        const gastosRounded = gastosRaw === 0 ? 0 : ceil2(gastosRaw);

        /* -----------------------------
           (5) Ponemos valores en la primera fila del pedido
        ------------------------------*/
        let first = true;
        for(const r of rows){
            if(first){
                r["Total coste pedido"] = sumaTotal;
                r["Gastos facturados SIN IVA"] = gastosRounded;
                r["Diferencia"] = ceil2(sumaTotal - gastosRounded);
                first = false;
            } else {
                r["Total coste pedido"] = "";
                r["Gastos facturados SIN IVA"] = "";
                r["Diferencia"] = "";
            }
        }
    }
}

function applyFiltersAndShow(){
    const q = normalizeText(searchInput.value || "");
    const filterCat = categoryFilter.value || "all";

    const filtered = processedData.filter(row => {
        if(filterCat !== 'all'){
            if(filterCat === 'none'){
                if((row["Categoría"] || "") !== "") return false;
            } else {
                if(row["Categoría"] !== filterCat) return false;
            }
        }
        if(!q) return true;
        const hay = [
            String(row["Fecha"] || ""),
            String(row["Expedidor"] || ""),
            String(row["Identificador de la tarea"] || ""),
            String(row["Nombre"] || ""),
            String(row["Cuenta"] || ""),
            String(row["Producto"] || ""),
            String(row["Código"] || ""),
            String(row["Familia"] || "")
        ].some(val => normalizeText(val).includes(q));
        return hay;
    });

    const fmt = v => (v === "" || v === null || v === undefined) ? "" : Number(v).toFixed(2);

    tableBody.innerHTML = filtered.map(row => {
        const cat = String(row["Categoría"] || "").toUpperCase();
        let rowClass = "row-none";
        if(cat.includes("PREM")) rowClass = "row-prem";
        else if(cat.includes("TIMA")) rowClass = "row-tima";
        else{
            const base = String(row["Categoría"]||"").toLowerCase();
            rowClass = `row-${base || 'none'}`;
        }

        const retiradaVal = row["Retirada"] ?? "";
        const retiradaClass = retiradaVal === "" ? "retirada" : "retirada not-empty";

        // diferencia cell highlight if Total coste pedido > Gastos facturados SIN IVA
        const diferenciaVal = row["Diferencia"];
        const diferenciaClass = (Number(row["Total coste pedido"]||0) > Number(row["Gastos facturados SIN IVA"]||0) && diferenciaVal !== "" ) ? "cell-exceso" : "";

        return `<tr class="${rowClass}">
            <td>${escapeHtml(row["Fecha"] ?? "")}</td>
            <td>${escapeHtml(row["Expedidor"] ?? "")}</td>
            <td>${escapeHtml(row["Transportista"] ?? "")}</td>
            <td>${escapeHtml(row["Repartidor"] ?? "")}</td>
            <td>${escapeHtml(row["Ruta"] ?? "")}</td>
            <td>${escapeHtml(row["Identificador de la tarea"] ?? "")}</td>
            <td>${escapeHtml(row["Cuenta"] ?? "")}</td>
            <td>${escapeHtml(row["Pedido de ventas"] ?? "")}</td>
            <td>${escapeHtml(row["Nombre"] ?? "")}</td>
            <td>${escapeHtml(row["Ciudad"] ?? "")}</td>
            <td>${escapeHtml(row["CP"] ?? "")}</td>
            <td>${escapeHtml(row["Producto"] ?? "")}</td>
            <td>${escapeHtml(row["Categoría"] ?? "")}</td>
            <td class="numeric">${escapeHtml(String(row["Cantidad"] ?? ""))}</td>
            <td class="numeric">${fmt(row["Neto / ud"])}</td>
            <td class="numeric">${fmt(row["Importe neto"])}</td>
            <td>${escapeHtml(row["Código"] ?? "")}</td>
            <td>${escapeHtml(row["Familia"] ?? "")}</td>
            <td class="numeric">${fmt(row["Tarifa unit."])}</td>
            <td class="numeric">${fmt(row["Tarifa x ud"])}</td>
            <td class="numeric">${fmt(row["Total"])}</td>
            <td class="${retiradaClass}">${escapeHtml(row["Retirada"] ?? "")}</td>
            <td>${escapeHtml(row["Estado"] ?? "")}</td>
            <td class="numeric">${fmt(row["Total coste pedido"])}</td>
            <td class="numeric">${fmt(row["Gastos facturados SIN IVA"])}</td>
            <td class="numeric ${diferenciaClass}">${fmt(row["Diferencia"])}</td>
            <td>${escapeHtml(row["Comentario OK"] ?? "")}</td>
            <td>${escapeHtml(row["Comentario KO"] ?? "")}</td>
        </tr>`;
    }).join('');

    countInfo.textContent = `Mostrando ${filtered.length} de ${processedData.length} filas`;
}

function escapeHtml(s){
    return String(s ?? "")
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#39;");
}

/* --- eventos UI --- */

categoryFilter.addEventListener('change', () => applyFiltersAndShow());
